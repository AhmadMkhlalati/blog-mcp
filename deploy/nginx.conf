# /etc/nginx/sites-available/neweast  (symlink into sites-enabled)
# Then: sudo certbot --nginx -d blog.neweast.cloud -d mcp.neweast.cloud

server {
    listen 80;
    server_name blog.neweast.cloud;

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name mcp.neweast.cloud;

    location / {
        proxy_pass http://127.0.0.1:3121;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP uses streaming (SSE) responses
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
